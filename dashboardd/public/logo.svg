<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <rect x="10" y="10" width="40" height="40" rx="10" fill="url(#iconGlow)" />
  
  <!-- Pulse / Candlestick graph lines -->
  <path d="M 18 32 L 24 32 L 28 20 L 33 40 L 38 26 L 42 32 L 44 32" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Small glowing pulse dot -->
  <circle cx="38" cy="26" r="2.5" fill="#ffffff" />

  <!-- Brand Text -->
  <text x="60" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    Trade<tspan fill="url(#pulseGrad)">Pulse</tspan>
  </text>
</svg>
